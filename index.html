<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Ritag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Cormorant+Garamond:ital,wght@1,600&family=Katibeh&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg1:#fff6ee;--bg2:#f4cbd5;--ink:#4a1330;--gold:#9a6420;--gold-dim:rgba(154,100,32,.45);
  --rose:#c4456f;--btn:#fffaf5;--glow:rgba(196,69,111,.35);--halo:rgba(214,51,108,.4);
  --panel:rgba(255,255,255,.55);--veil:rgba(255,246,238,.86);
  --pk1:#ff9cc6;--pk2:#ff4f9a;--pk-dim:rgba(255,79,154,.3);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#3d1030;--bg2:#12050f;--ink:#fff1e3;--gold:#ebcb8b;--gold-dim:rgba(235,203,139,.45);
    --rose:#f08ca7;--btn:#241022;--glow:rgba(235,203,139,.45);--halo:rgba(240,110,150,.5);
    --panel:rgba(255,255,255,.06);--veil:rgba(61,16,48,.86);
  }
}
:root[data-theme="dark"]{
  --bg1:#3d1030;--bg2:#12050f;--ink:#fff1e3;--gold:#ebcb8b;--gold-dim:rgba(235,203,139,.45);
  --rose:#f08ca7;--btn:#241022;--glow:rgba(235,203,139,.45);--halo:rgba(240,110,150,.5);
  --panel:rgba(255,255,255,.06);--veil:rgba(61,16,48,.86);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow-x:hidden;overflow-y:auto;color:var(--ink);
  background:radial-gradient(110% 80% at 50% 10%,var(--bg1),var(--bg2)) fixed;
  font-family:Katibeh,'Noto Naskh Arabic',serif;
}
body.on4::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:5}
.fl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fh{position:absolute;bottom:-40px;animation:float linear infinite}
.fh svg{display:block;width:100%;height:auto}
@keyframes float{
  from{transform:translate(0,0) rotate(-10deg)}
  50%{transform:translate(22px,-60vh) rotate(8deg)}
  to{transform:translate(-10px,-125vh) rotate(-6deg)}
}
.page{
  position:relative;z-index:1;display:none;min-height:100%;flex-direction:column;align-items:center;justify-content:center;
  gap:1.3rem;padding:2.2rem 1.3rem;text-align:center;animation:fade 1.4s ease both;
}
.page.on{display:flex}
.page.out{animation:fadeout 1.4s ease forwards}
.page.top{justify-content:flex-start;padding-top:1rem;padding-bottom:3.5rem}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.fadein{animation:fadein 1.1s ease both;animation-delay:var(--d,0s)}
.pre{opacity:0;pointer-events:none}
.pre.show{opacity:1;pointer-events:auto;animation:fadein 1.1s ease both}

.script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400;margin:0;line-height:1.15}
.name{display:flex;justify-content:center;font-size:clamp(5rem,28vw,11rem);color:var(--gold);text-shadow:0 0 40px var(--glow)}
.name span{display:inline-block;padding:0 .12em;margin:0 -.08em;animation:write 1.5s cubic-bezier(.4,0,.2,1) both}
@keyframes write{
  from{opacity:0;clip-path:inset(-.3em 100% -.3em -.3em)}
  to{opacity:1;clip-path:inset(-.3em -.3em -.3em -.3em)}
}

.beat{position:relative;width:clamp(64px,18vw,90px)}
.beat::before{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose);
  animation:ripple 1.4s ease-out infinite;
}
.hrt{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 0 14px var(--glow));animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}65%{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(.7);opacity:0}15%{opacity:.55}100%{transform:scale(2.1);opacity:0}}

/* pink "bambi" LED ribbon running around an element */
.ring{position:relative;isolation:isolate;border:1px solid var(--pk-dim)}
.ring::before,.ring::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:3px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 50%,var(--pk1) 66%,var(--pk2) 80%,#fff 90%,var(--pk1) 95%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:ribbon 3.4s linear infinite;
}
.ring::after{filter:blur(8px);opacity:.9;z-index:-1}
@keyframes ribbon{to{--a:360deg}}
.lbl{
  display:block;white-space:nowrap;background:var(--btn);color:var(--gold);border-radius:999px;padding:.9rem 1.7rem;
  font:italic 600 clamp(1.15rem,5.4vw,1.4rem)/1.2 'Cormorant Garamond',Georgia,serif;
}
button.lbl{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* page 2: framed love letter */
.frame{
  position:fixed;z-index:0;pointer-events:none;border:1px solid var(--gold-dim);border-radius:22px;
  inset:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;
}
.frame svg{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:42px;height:auto;padding:0 8px;background:var(--bg1)}
.hello{font-size:clamp(4rem,20vw,6rem);color:var(--gold);text-shadow:0 0 30px var(--halo)}
.msg{max-width:28rem;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.8}
.msg p{margin:.1rem 0}
.msg .to{color:var(--gold);font-size:1.12em}
.msg .from{color:var(--rose)}
.ln{margin:.1rem 0}
.box{position:relative;display:inline-block;text-align:start}
.ghost{visibility:hidden}
.typed{position:absolute;inset:0;text-align:start}
.typed.on::after{content:"";display:inline-block;width:2px;height:.85em;margin-inline-start:.1em;background:currentColor;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mini{display:inline-block;width:.7em;height:.7em;vertical-align:-.05em}
.mini.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.orn{display:flex;align-items:center;gap:.7rem;width:min(14rem,60%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gold-dim)}
.orn svg{width:14px;height:14px}
.sign{font-size:clamp(2.1rem,9.5vw,3rem)}
.gate{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.pw{
  width:min(16rem,100%);font:400 1.4rem/1 Georgia,serif;text-align:center;letter-spacing:.35em;color:var(--ink);
  background:transparent;border:0;border-bottom:1.5px solid var(--gold-dim);border-radius:0;padding:.6rem .4rem;
}
.pw::placeholder{font:italic 600 1.3rem 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:var(--gold);opacity:.8}
.pw:focus{border-bottom-color:var(--gold);box-shadow:0 8px 14px -10px var(--glow)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err,.note{margin:0;min-height:1.4em;color:var(--rose);font:italic 600 1.2rem/1.4 'Cormorant Garamond',Georgia,serif}
.note{color:var(--gold)}

/* page 4: counter + messages */
.counter{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:4;width:min(30rem,100%);padding:.65rem .9rem .55rem;
  border:1px solid var(--gold-dim);border-radius:18px;background:var(--veil);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.since{
  margin:0 0 .3rem;display:flex;align-items:center;justify-content:center;gap:.5rem;color:var(--rose);
  font:400 .95rem/1 Cairo,sans-serif;
}
.since .mini{width:.85em;height:.85em;animation:pulse 1.4s ease-in-out infinite}
.units{display:flex;direction:ltr}
.u{flex:1;text-align:center}
.u+.u{border-left:1px solid var(--gold-dim)}
.u b{
  display:block;color:var(--gold);font:600 clamp(1.7rem,8vw,2.3rem)/1.2 Cairo,sans-serif;
  font-variant-numeric:lining-nums tabular-nums;
}
.u span{font:400 .95rem/1.2 Cairo,sans-serif;opacity:.9}
.feed{width:min(30rem,100%);display:flex;flex-direction:column;gap:1.5rem;padding:.8rem .3rem 0}
.bub{border-radius:20px;padding:1rem 1.1rem;background:var(--panel);animation:bubin .8s ease both}
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.m{text-align:center}
.m{font-family:Cairo,'Noto Naskh Arabic',sans-serif;font-weight:400}
.m.rtl{font-size:clamp(1.15rem,4.8vw,1.4rem);line-height:2}
.m.ltr{font-size:clamp(1.15rem,4.8vw,1.4rem);line-height:1.8}
#fsign{font-size:clamp(2.6rem,12vw,3.6rem);color:var(--gold);text-shadow:0 0 30px var(--halo);margin-top:.6rem}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8bd"/><stop offset="1" stop-color="#d6336c"/></linearGradient></defs>
  <symbol id="h" viewBox="0 0 24 24"><path fill="url(#hg)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
</svg>
<div class="fl" id="fl" aria-hidden="true"></div>

<section class="page on" id="p1">
  <h1 class="script name" id="nm" aria-label="Ritag"></h1>
  <div class="fadein beat" style="--d:6.2s"><svg class="hrt" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg></div>
  <div class="fadein" style="--d:7.2s"><div class="lbl ring">Let’s get to the surprise!</div></div>
</section>

<section class="page" id="p2">
  <div class="frame" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#h"/></svg></div>
  <h2 class="script hello fadein" style="--d:.4s">My Love</h2>
  <div class="msg" id="msg" dir="rtl" lang="ar"></div>
  <div class="orn pre" id="orn" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#h"/></svg></div>
  <p class="script sign pre" id="sign">Mahmoud <svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg> Ritag</p>
  <div class="gate pre" id="gate">
    <input class="pw" id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" aria-label="Password">
    <button class="lbl ring" id="go2">Let’s get to the surprise!</button>
    <p class="err" id="err" aria-live="polite"></p>
  </div>
</section>

<section class="page" id="p3">
  <h2 class="script name" style="font-size:clamp(3.6rem,18vw,6rem)">Welcome, Ritag</h2>
  <div class="beat"><svg class="hrt" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg></div>
  <p class="note">Your surprise starts here…</p>
</section>

<section class="page top" id="p4">
  <div class="counter" id="ctr">
    <p class="since"><svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg><span>Since 16/10/2026 · 11:37 PM</span><svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg></p>
    <div class="units">
      <div class="u"><b id="cd">0</b><span>أيام</span></div>
      <div class="u"><b id="ch">00</b><span>ساعات</span></div>
      <div class="u"><b id="cm">00</b><span>دقايق</span></div>
      <div class="u"><b id="cs">00</b><span>ثواني</span></div>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <p class="script pre" id="fsign">Mahmoud <svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg> Ritag</p>
</section>

<script>
(function(){
  var PASS=['16102026','2252009'];
  var HOLD_MS=11800;                      // page 1 stays this long, then moves on by itself
  var WELCOME_MS=4200;                    // page 3 (about 3 seconds fully visible after the fade in)
  var START=new Date(2026,9,16,23,37,0);  // counter start: 16/10/2026 11:37 PM (device local time)
  var TYPE_MS=85;                         // page 2: average milliseconds per letter
  var MSG_MS=48;                          // page 4: average milliseconds per letter
  var MSG_GAP=900;                        // page 4: pause after each message
  var MSGS=[
    'I Love yooooooooooou ❤️',
    'I love you, Ritag ❤️😘',
    'بحبك قد كل زمان وقد الجاي في حياتنا ❤️',
    'انا عايز اقولك ان اللي بعمله ده من كل قلبي لروحقلبي ❤️',
    'اتمني الحاجه البسيطه دي تفرحك ❤️ حتي لو بمقدار ذره ..وانا بفرح لفرحتك ❤️',
    'وانا هحطك في عيني وعمري في يوم ما ازعلك ولا اتخلي عنك ❤️🫂',
    'ربنا يخليكي ليا يا اجمل حاجه قابلتها ف حياتي واجمل رتاج ف الدنيا ... وأجمل حب ❤️🫂',
    'انا بقولك من موقعي هذا اناااااااااااااااااا بحبببببببببببببببببببببببببببيك ❤️😘',
    'يا اجمل صدفة ف عمري يا كل ما ليا ❤️🫂',
    'بجد بجد انتي اسرع حد دخل قلبي وحياتي وحبيته من كل قلبي بصدق ❤️🫂🫂🫂',
    'ربنا ما يحرمنا من بعض ابدا ويخلينا لبعض ولبعض ان شاء الله ف اقرب وقت ❤️🫂',
    'وان شاء الله ابقي قد الحلم واقدر انفذه ❤️💗',
    'انا عايز اقولك ان الكلام اللي كتبته ميعبرش عن حاجه من حبي فيكي 💗🫂',
    'كل سنه ورا سنه ورا سنه وحبي ليكي يزيد 💗🫂',
    'اتعلمي بقا الكلام بيتكتب ازاي من القلب 😉😂'
  ];
  var $=function(s){return document.querySelector(s)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  // page 1: name written slowly, letter by letter
  var nm=$('#nm');
  'Ritag'.split('').forEach(function(c,i){
    var s=document.createElement('span');
    s.textContent=c;s.setAttribute('aria-hidden','true');
    s.style.animationDelay=(0.6+i*1.1)+'s';
    nm.appendChild(s);
  });

  // floating hearts in the background
  var fl=$('#fl');
  for(var i=0;i<16;i++){
    var d=document.createElement('div');
    d.className='fh';
    d.style.cssText='left:'+(Math.random()*96)+'%;width:'+(10+Math.random()*18)+'px;opacity:'+(0.12+Math.random()*0.18)+
      ';animation-duration:'+(16+Math.random()*14)+'s;animation-delay:-'+(Math.random()*28)+'s';
    d.innerHTML='<svg viewBox="0 0 24 24"><use href="#h"/></svg>';
    fl.appendChild(d);
  }

  // grapheme-safe splitting, so emoji and Arabic letters are typed whole
  var seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter(undefined,{granularity:'grapheme'}):null;
  function chars(s){return seg?Array.from(seg.segment(s),function(x){return x.segment}):Array.from(s)}
  function keepInView(el){
    var r=el.getBoundingClientRect(),lim=window.innerHeight-36;
    if(r.bottom>lim)window.scrollBy({top:r.bottom-lim,behavior:'smooth'});
  }

  // page 2: the message is typed out live, with a blinking cursor
  var HEART='<svg class="mini pop" viewBox="0 0 24 24" aria-hidden="true"><use href="#h"/></svg>';
  var lines=['لحبيبتي ونور عيني','التي أنارت حياتي بقدومها','رفيقة دربي وشريكة حياتي المستقبلية','من كل قلبي'];
  var msg=$('#msg'),typedEls=[];
  lines.forEach(function(text,li){
    var p=document.createElement('p');
    p.className='ln'+(li===0?' to':'')+(li===3?' from':'');
    p.innerHTML='<span class="box"><span class="ghost">'+text+(li===3?' '+HEART:'')+'</span><span class="typed"></span></span>';
    msg.appendChild(p);typedEls.push(p.querySelector('.typed'));
  });
  var typing=false;
  function reveal(ids){
    ids.forEach(function(id,i){var el=$(id);setTimeout(function(){el.classList.add('show')},i*700)});
  }
  function startTyping(){
    if(typing)return;typing=true;
    var all=['#orn','#sign','#gate'];
    if(reduce){typedEls.forEach(function(el,i){el.innerHTML=lines[i]+(i===3?' '+HEART:'')});reveal(all);return}
    var li=0,ci=0;
    typedEls[0].classList.add('on');
    function step(){
      var el=typedEls[li],text=lines[li];
      if(ci<text.length){
        ci++;el.textContent=text.slice(0,ci);
        setTimeout(step,TYPE_MS*(0.7+Math.random()*0.7)+(text.charAt(ci-1)===' '?60:0));
      }else{
        el.classList.remove('on');
        if(li===3)el.innerHTML=text+' '+HEART;
        li++;ci=0;
        if(li<lines.length){typedEls[li].classList.add('on');setTimeout(step,650)}
        else setTimeout(function(){reveal(all)},700);
      }
    }
    setTimeout(step,1900);
  }

  // page 4: counter since the first day
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var s=Math.max(0,Math.floor((Date.now()-START.getTime())/1000));
    $('#cd').textContent=Math.floor(s/86400);
    $('#ch').textContent=pad(Math.floor(s%86400/3600));
    $('#cm').textContent=pad(Math.floor(s%3600/60));
    $('#cs').textContent=pad(s%60);
  }
  tick();setInterval(tick,1000);

  // page 4: messages typed one by one, each in its own glowing bubble, with auto-scroll
  var feed=$('#feed'),fed=false;
  function makeBubble(text){
    var rtl=/^[^A-Za-z\u0600-\u06FF]*[\u0600-\u06FF]/.test(text);
    var b=document.createElement('div');
    b.className='bub ring';
    b.innerHTML='<div class="m '+(rtl?'rtl':'ltr')+'"><span class="box" dir="'+(rtl?'rtl':'ltr')+'"><span class="ghost"></span><span class="typed on"></span></span></div>';
    b.querySelector('.ghost').textContent=text;
    feed.appendChild(b);
    return {el:b,typed:b.querySelector('.typed')};
  }
  function typeInto(el,text,done){
    var cs=chars(text),i=0;
    function step(){
      if(i<cs.length){
        i++;el.textContent=cs.slice(0,i).join('');
        var same=i>1&&cs[i-1]===cs[i-2];
        setTimeout(step,MSG_MS*(0.6+Math.random()*0.8)*(same?0.5:1)+(cs[i-1]===' '?40:0));
      }else{
        el.classList.remove('on');
        setTimeout(done,MSG_GAP);
      }
    }
    step();
  }
  function finishFeed(){
    $('#fsign').classList.add('show');
    setTimeout(function(){keepInView($('#fsign'))},400);
  }
  function startFeed(){
    if(fed)return;fed=true;
    if(reduce){MSGS.forEach(function(t){var b=makeBubble(t);b.typed.textContent=t;b.typed.classList.remove('on')});finishFeed();return}
    var n=0;
    function next(){
      if(n>=MSGS.length){finishFeed();return}
      var text=MSGS[n++],b=makeBubble(text);
      setTimeout(function(){
        keepInView(b.el);
        setTimeout(function(){typeInto(b.typed,text,next)},500);
      },300);
    }
    setTimeout(next,1800);
  }

  function go(id){
    document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('on',p.id===id);p.classList.remove('out')});
    document.body.classList.toggle('on4',id==='p4');
    document.body.scrollTop=0;window.scrollTo(0,0);
    if(id==='p2')startTyping();
    if(id==='p3')setTimeout(function(){fadeTo('p3','p4')},WELCOME_MS);
    if(id==='p4')startFeed();
  }
  function fadeTo(from,to){
    $('#'+from).classList.add('out');
    setTimeout(function(){go(to)},1400);
  }

  // page 1 moves on to page 2 by itself, smoothly
  setTimeout(function(){fadeTo('p1','p2')},HOLD_MS);

  // page 2: password, then on to page 3
  var pw=$('#pw'),err=$('#err');
  function norm(v){
    return v.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\D/g,'');
  }
  function check(){
    if(PASS.indexOf(norm(pw.value))>-1){err.textContent='';go('p3');return}
    err.textContent='Not quite, my love. Try again';
    pw.classList.remove('shake');void pw.offsetWidth;pw.classList.add('shake');
    pw.select();
  }
  $('#go2').onclick=check;
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
})();
</script>
</body>
</html>
